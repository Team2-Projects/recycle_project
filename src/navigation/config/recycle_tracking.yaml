# Integrated defaults: lost_abort_frames=12, approach_far_speed=0.08 (user settings).
# Robot-verified base behavior is preserved; the vision-health degradation/recovery
# thresholds below are newly added and still need one real-robot timing check.
# Uploaded branch collection mode is preserved; final motion is enabled/calibrated.
# Same calibration: 640x480 image, fixed pan/tilt capture pose, x=350, bottom=430.
recycle_tracking_node:
  ros__parameters:
    control_period_sec: 0.10
    # Vision receipt health: slow stream -> DEGRADED, no result -> WAIT, long outage -> STALE.
    # 0.6 s/result is allowed to keep working in DEGRADED mode instead of failing.
    degraded_detection_age_sec: 0.50
    # Hard motion stop threshold. This is intentionally wider than DEGRADED.
    max_detection_age_sec: 1.00
    # Return NORMAL only after this many new results arrive at <= degraded threshold.
    degraded_clear_frames: 3
    # In DEGRADED mode, approach speed is halved. Alignment keeps its proven
    # minimum angular speed while larger rotation/steering commands are reduced.
    degraded_speed_scale: 0.50
    # WAIT is not terminal. Recovery has its own wider interval acceptance.
    sensor_recovery_timeout_sec: 4.0
    sensor_recovery_frames: 3
    sensor_recovery_min_interval_sec: 0.05
    sensor_recovery_max_interval_sec: 1.20
    reacquire_start_frames: 3
    lost_abort_frames: 12
    lock_target_class: true

    # 852f86b "align 350" 반영. 팬틸트 재설치 후 캘리브레이션 값.
    align_reference_x: 350.0
    align_tolerance_px: 15.0
    align_stable_frames: 3
    # Deadband + min/max-clamped P. Fixed minimum at 15..50 px; NOT pure P.
    align_kp: 0.0010
    align_min_angular_speed: 0.05
    align_max_angular_speed: 0.12
    align_timeout_sec: 15.0

    # Progress watchdog + absolute safety cap. A slow DEGRADED stream may
    # continue while geometry is still improving; mere message heartbeats do not
    # reset progress. SENSOR_WAIT and LOST_TARGET have their own bounded policies.
    approach_progress_timeout_sec: 12.0
    approach_progress_lower_y_delta_px: 5.0
    approach_progress_align_error_delta_px: 8.0
    # Hard cap across REALIGN/SENSOR_WAIT/final motion; never reset by recovery.
    approach_timeout_sec: 60.0
    approach_stop_lower_y: 430.0
    approach_stop_stable_frames: 2
    approach_realign_threshold_px: 40.0
    approach_steer_kp: 0.0004
    approach_max_angular_speed: 0.06
    approach_mid_lower_y: 330.0
    approach_near_lower_y: 390.0
    approach_far_speed: 0.08
    approach_mid_speed: 0.04
    approach_near_speed: 0.02

    stop_only_test_mode: false
    # Only set true after measuring actual remaining distance on the robot.
    final_approach_calibrated: true
    final_approach_speed: 0.03
    # NOMINAL 30 cm / 0.03 m/s. Not 30 cm measured by odometry.
    final_approach_duration_sec: 10.0
    tracking_service_timeout_sec: 3.0

    # Collision guard: only tracking owns this chain;
    # Nav2 patrol and recycle.py keep their existing velocity path.
    collision_scan_timeout_sec: 0.40
    collision_raw_timeout_sec: 0.50
    collision_safe_timeout_sec: 0.50
    collision_watchdog_period_sec: 0.05
    collision_ready_timeout_sec: 3.0
    collision_fault_timeout_sec: 3.0
    # Receipt-v1: real scan + safe samples and a dwell, not repeated control ticks.
    collision_recovery_stable_sec: 0.50
    collision_recovery_frames: 3
    collision_scan_restart_frames: 3
    # Per Action; a repeatedly failing target is retired instead of retried forever.
    collision_auto_recovery_limit: 2
    collision_hold_timeout_sec: 3.0
    collision_hold_clear_ratio: 0.80
    collision_hold_clear_frames: 3
    collision_clear_min_interval_sec: 0.04
    collision_linear_zero_threshold: 0.002
    collision_angular_zero_threshold: 0.005
    collision_modification_tolerance: 0.00001
    # Test-calibrated capture pose: do not silently reuse Nav2's older +0.268.
    # Changing these requires matching HardStop.points below.
    collision_footprint_front_x: 0.325
    collision_footprint_rear_x: -0.196
    collision_footprint_half_width: 0.14
    collision_hard_stop_margin: 0.01
    collision_geometry_timeout_sec: 1.0
    # Pi and PC system clocks must agree. A stale/future stamped scan is NOT
    # made safe by a new receipt; fail closed instead of rewriting timestamps.
    collision_future_stamp_tolerance_sec: 0.10

auto_nav:
  ros__parameters:
    # Same scan policy as Tracking above; parity is regression-tested.
    # Humble's ROS parameter parser does not support YAML aliases.
    collision_scan_timeout_sec: 0.40
    collision_scan_restart_frames: 3
    collision_clear_min_interval_sec: 0.04
    collision_future_stamp_tolerance_sec: 0.10
    tracking_failure_cooldown_sec: 2.0
    # Abandon a failed target and automatically resume patrol when
    # common scan/TF/odom/Nav2 and verified servo closure are ready. Monitor-only
    # failure disables collection, NOT otherwise-ready Nav2 patrol.
    # Interrupted final motion retires the attempt, never resumes its
    # remaining seconds or increments the collection count. Verify release,
    # stopped odom, servo closure and common Nav2 readiness before patrol.
    # TEST_STOP/operator cancellation/unknown internal errors stay manual.
    # Manual reset queues the same readiness checks; it is NOT a bypass.
    patrol_recovery_enabled: true
    patrol_recovery_final_interrupted_enabled: true
    patrol_recovery_period_sec: 0.20
    patrol_recovery_stable_sec: 0.50
    patrol_recovery_samples: 3
    patrol_recovery_health_timeout_sec: 0.80
    patrol_recovery_odom_timeout_sec: 0.60
    patrol_recovery_future_stamp_tolerance_sec: 0.10
    patrol_recovery_stopped_linear_speed: 0.01
    patrol_recovery_stopped_angular_speed: 0.02
    patrol_recovery_service_timeout_sec: 2.0
    patrol_recovery_service_retry_sec: 3.0
    patrol_recovery_nav_state_poll_sec: 0.50
    patrol_recovery_nav_state_timeout_sec: 2.0
    patrol_recovery_nav2_nodes: [controller_server, planner_server, bt_navigator]
    # No instance tracker: lock ALL new collection until a waypoint SUCCEEDS
    # after >=10cm real odom displacement, not mere timeout/visual disappearance.
    patrol_recovery_release_distance_m: 0.10
    sensor_recovery_frames: 3
    sensor_recovery_min_interval_sec: 0.05
    sensor_recovery_max_interval_sec: 1.20


# Humble-only parameter names (Twist, flat double array, max_points).
tracking_collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/tracking_cmd_vel_raw"
    cmd_vel_out_topic: "/tracking_cmd_vel_safe"
    transform_tolerance: 0.3
    source_timeout: 0.40
    base_shift_correction: false
    # Humble stops publishing repeated zero velocities after this timeout.
    # Private output cannot affect patrol; retain zero replies for watchdogs
    # and future actions, including long periods spent idling between actions.
    stop_pub_timeout: 1000000000.0
    polygons: ["HardStop", "FootprintApproach"]
    HardStop:
      type: "polygon"
      points: [0.335, 0.15, 0.335, -0.15, -0.206, -0.15, -0.206, 0.15]
      action_type: "stop"
      max_points: 0
      visualize: true
      polygon_pub_topic: "/tracking_collision/hard_stop"
      enabled: true
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/tracking_collision/footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      max_points: 3
      visualize: true
      polygon_pub_topic: "/tracking_collision/footprint_checked"
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      # Same ORIGINAL stamped scans as the guard accepted. Original /scan
      # (and all Nav2 consumers) are untouched. Do not restore /scan here alone.
      topic: "/tracking_collision/scan"
      enabled: true

lifecycle_manager_tracking_collision:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["tracking_collision_monitor"]
    bond_timeout: 4.0
